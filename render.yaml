services:
  - type: web
    name: tally-nexus
    env: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: tally-nexus-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: /data/tally_nexus.db
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: APP_BASE_URL
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: OPERATOR_API_KEY
        generateValue: true
      - key: AGENT_SHARED_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: FREEMODEL_API_KEY
        sync: false
      - key: FREEMODEL_BASE_URL
        value: https://freemodel.in/v1
      - key: FREEMODEL_PRIMARY_MODEL
        value: gemini-3.7-flash
      - key: FREEMODEL_FALLBACK_MODEL
        value: deepseek-v4.1-flash


